{
  "name": "paths",
  "title": "Mediation and Moderation",
  "menuGroup": "PathLab",
  "version": "0.4.6",
  "jas": "1.2",
  "weightsSupport": "none",
  "description": {
    "main": "Choose the original or general graph editor. Select variables, explicit arrows and their moderator attachments. General graphs support up to ten continuous mediators and three moderators, subject to path and computation budgets."
  },
  "options": [
    {
      "name": "data",
      "type": "Data"
    },
    {
      "name": "x",
      "title": "Predictor (X)",
      "type": "Variable",
      "suggested": [
        "continuous"
      ],
      "permitted": [
        "numeric",
        "factor"
      ]
    },
    {
      "name": "m1",
      "title": "First mediator (M1, optional)",
      "type": "Variable",
      "suggested": [
        "continuous"
      ],
      "permitted": [
        "numeric"
      ],
      "default": null
    },
    {
      "name": "m2",
      "title": "Second mediator (M2, optional)",
      "type": "Variable",
      "suggested": [
        "continuous"
      ],
      "permitted": [
        "numeric"
      ],
      "default": null
    },
    {
      "name": "y",
      "title": "Outcome (Y)",
      "type": "Variable",
      "suggested": [
        "continuous"
      ],
      "permitted": [
        "numeric",
        "factor"
      ]
    },
    {
      "name": "w",
      "title": "Moderator (W, optional)",
      "type": "Variable",
      "suggested": [
        "continuous"
      ],
      "permitted": [
        "numeric",
        "factor"
      ],
      "default": null
    },
    {
      "name": "p_x_m1",
      "title": "X → M1",
      "type": "Bool",
      "default": true
    },
    {
      "name": "p_x_m2",
      "title": "X → M2",
      "type": "Bool",
      "default": true
    },
    {
      "name": "p_m1_m2",
      "title": "M1 → M2",
      "type": "Bool",
      "default": true
    },
    {
      "name": "p_x_y",
      "title": "X → Y",
      "type": "Bool",
      "default": true
    },
    {
      "name": "p_m1_y",
      "title": "M1 → Y",
      "type": "Bool",
      "default": true
    },
    {
      "name": "p_m2_y",
      "title": "M2 → Y",
      "type": "Bool",
      "default": true
    },
    {
      "name": "p_w_m1",
      "title": "W → M1",
      "type": "Bool",
      "default": true
    },
    {
      "name": "p_w_m2",
      "title": "W → M2",
      "type": "Bool",
      "default": false
    },
    {
      "name": "p_w_y",
      "title": "W → Y",
      "type": "Bool",
      "default": false
    },
    {
      "name": "mod_x_m1",
      "title": "W moderates X → M1",
      "type": "Bool",
      "default": true
    },
    {
      "name": "mod_x_m2",
      "title": "W moderates X → M2",
      "type": "Bool",
      "default": false
    },
    {
      "name": "mod_m1_m2",
      "title": "W moderates M1 → M2",
      "type": "Bool",
      "default": false
    },
    {
      "name": "mod_x_y",
      "title": "W moderates X → Y",
      "type": "Bool",
      "default": false
    },
    {
      "name": "mod_m1_y",
      "title": "W moderates M1 → Y",
      "type": "Bool",
      "default": false
    },
    {
      "name": "mod_m2_y",
      "title": "W moderates M2 → Y",
      "type": "Bool",
      "default": false
    },
    {
      "name": "robust",
      "title": "HC3 covariance (normal reference)",
      "type": "Bool",
      "default": true
    },
    {
      "name": "draws",
      "title": "Bootstrap draws",
      "type": "Integer",
      "min": 200,
      "max": 5000,
      "default": 1000
    },
    {
      "name": "seed",
      "title": "Seed",
      "type": "Integer",
      "min": 0,
      "max": 2147483647,
      "default": 419
    },
    {
      "name": "confidence",
      "title": "Confidence level (%)",
      "type": "Number",
      "min": 50.1,
      "max": 99.9,
      "default": 95
    },
    {
      "name": "probes",
      "title": "W probe values (comma separated; blank = 16th/50th/84th percentiles)",
      "type": "String",
      "default": ""
    },
    {
      "name": "showDetails",
      "title": "Show reproducibility JSON and diagnostic details",
      "type": "Bool",
      "default": false
    },
    {
      "name": "showCovariance",
      "title": "Show full coefficient covariance",
      "type": "Bool",
      "default": false
    },
    {
      "name": "covM1",
      "title": "Covariates in M1 equation",
      "type": "Variables",
      "default": null,
      "suggested": [
        "continuous"
      ],
      "permitted": [
        "numeric",
        "factor"
      ]
    },
    {
      "name": "covM2",
      "title": "Covariates in M2 equation",
      "type": "Variables",
      "default": null,
      "suggested": [
        "continuous"
      ],
      "permitted": [
        "numeric",
        "factor"
      ]
    },
    {
      "name": "covY",
      "title": "Covariates in Y equation",
      "type": "Variables",
      "default": null,
      "suggested": [
        "continuous"
      ],
      "permitted": [
        "numeric",
        "factor"
      ]
    },
    {
      "name": "modelMode",
      "title": "Model editor",
      "type": "List",
      "options": [
        {
          "name": "legacy",
          "title": "Original editor"
        },
        {
          "name": "general",
          "title": "General graph"
        }
      ],
      "default": "legacy"
    },
    {
      "name": "generalMediators",
      "title": "Ordered mediators (M1 to M10, top to bottom)",
      "type": "Variables",
      "default": null,
      "suggested": [
        "continuous"
      ],
      "permitted": [
        "numeric"
      ]
    },
    {
      "name": "generalModerators",
      "title": "Moderators (W, Z, V, top to bottom)",
      "type": "Variables",
      "default": null,
      "suggested": [
        "continuous"
      ],
      "permitted": [
        "numeric",
        "factor"
      ]
    },
    {
      "name": "generalCovariates",
      "title": "Covariates (C1 to C20, top to bottom)",
      "type": "Variables",
      "default": null,
      "suggested": [
        "continuous"
      ],
      "permitted": [
        "numeric",
        "factor"
      ]
    },
    {
      "name": "generalPaths",
