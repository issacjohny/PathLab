          {
            "name": "target",
            "type": "List",
            "options": [
              "M1",
              "M2",
              "M3",
              "M4",
              "M5",
              "M6",
              "M7",
              "M8",
              "M9",
              "M10",
              "Y"
            ],
            "default": "M1"
          },
          {
            "name": "mod1",
            "type": "List",
            "options": [
              "W",
              "Z",
              "V"
