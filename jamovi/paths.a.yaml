            "default": "W"
          },
          {
            "name": "mod2",
            "type": "List",
            "options": [
              "none",
              "W",
              "Z",
              "V"
            ],
            "default": "none"
          }
        ]
      }
    },
    {
      "name": "generalProbesW",
      "title": "W probes (blank = percentiles or all categories)",
      "type": "String",
      "default": ""
