    {
      "name": "showEffectPlot",
      "title": "Effect plot with bootstrap intervals",
      "type": "Bool",
      "default": false
    },
    {
      "name": "showInteractionPlot",
      "title": "Fitted interaction plot",
      "type": "Bool",
      "default": false
    },
    {
      "name": "showJNPlot",
      "title": "Johnson–Neyman path-slope plot",
      "type": "Bool",
      "default": false
    },
    {
      "name": "plotInteractionMode",
      "title": "Interaction plots to display",
      "type": "List",
      "options": [
        {
          "name": "selected",
          "title": "Selected arrow"
        },
        {
          "name": "all",
          "title": "All moderated arrows (six per page)"
        }
      ],
      "default": "selected"
    },
    {
      "name": "plotInteractionPage",
      "title": "Interaction plot page",
      "type": "Integer",
      "min": 1,
      "max": 100,
      "default": 1
